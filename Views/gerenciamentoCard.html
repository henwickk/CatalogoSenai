<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SENAI - Gerenciar Cursos</title>

    <link rel="stylesheet" href="/Views/css/gerenciamentoCard.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="layout">
  

      <aside class="sidebar">
        <div class="logo">
          <h1>SENAI</h1>
          <span>CATÁLOGO DE CURSOS</span>
        </div>

        <nav class="menu">

          <a href="#" class="menu-item">
            <i class="bi bi-book-fill"></i>
            <span>Cadastro Curso</span>
          </a>

                    <a href="#" class="menu-item active">
            <i class="bi bi-card-list"></i>
            <span>Gerenciar Cursos</span>
          </a>


          <a href="#" class="menu-item">
          <i class="bi bi-arrow-left-square"></i>
            <span>Sair</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="people">
            <div class="person person1"></div>
            <div class="person person2"></div>
            <div class="person person3"></div>
          </div>

          <div class="sidebar-text">
            <span>O FUTURO</span>
            <span>SE CONSTRÓI</span>
            <strong>AQUI</strong>
          </div>
        </div>
      </aside>

   

      <main class="main">
        

        <header class="topbar">
          <i class="bi bi-bell bell"></i>

          <div class="user">
            <div class="avatar">A</div>

            <span>Administrador</span>

            <i class="bi bi-chevron-down"></i>
          </div>
        </header>

      

        <section class="content">
        

          <div class="page-header">
            <div>
              <h2>Gerenciar Cursos</h2>

              <p>Visualize, edite ou exclua os cursos cadastrados.</p>
            </div>
          </div>

         

          <div class="card">
        

            <div class="search-area">
              <div class="search-row">
                <div class="search">
                  <i class="bi bi-search"></i>

                  <input type="text" placeholder="Pesquisar curso..." />
                </div>

                <button class="filter-button">
                  <i class="bi bi-funnel"></i>

                  Filtros
                </button>
              </div>

             

              <div class="filters">
                <button class="filter active">Todos</button>

                <button class="filter">Manhã</button>

                <button class="filter">Tarde</button>

                <button class="filter">Noite</button>

                <button class="category">
                  Todas as categorias
                  <i class="bi bi-chevron-down"></i>
                </button>
              </div>
            </div>

          

            <div class="table-header">
              <div>CURSO</div>

              <div>CATEGORIA</div>

              <div>TURNO</div>

              

              <div>STATUS</div>

              <div>AÇÕES</div>
            </div>

           

            <div class="course">  
              <div class="course-info">
                <img
                  src="img/0c5c7bb8a70b7617160a47cb3a97c99b.jpg"
                  alt="Desenvolvimento Web"
                />

                <div>
                  <h3>Confeiteiro</h3>
                </div>
              </div>

              <div>Alimentação</div>

              <div>
                <span class="shift morning"> Manhã </span>
              </div>

              

              <div>
                <span class="status published"> Publicado </span>
              </div>

              <div class="actions">

                <button>
                  <i class="bi bi-pencil"></i>
                </button>

                <button class="delete">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>

            <div class="pagination">
              <span> Mostrando 1 a 5 de 12 cursos </span>

              <div class="pages">
                <button>
                  <i class="bi bi-chevron-left"></i>
                </button>

                <button class="selected">1</button>

                <button>2</button>

                <button>3</button>

                <button>
                  <i class="bi bi-chevron-right"></i>
                </button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
