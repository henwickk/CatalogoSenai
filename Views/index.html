<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalógo Senai</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- HEADER -->

    <header>
        <img src="/Views/img/senai.svg" alt="">
        <div id="divHeader">
            <a href="">Home</a>
            <a href="">Cursos</a>
            <a href="">Contatos</a>
            <button id="temaEscuro" type="">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>

    </header>

    <!-- BANNER -->

    <section id="banner">
        <div class="banner-img">
        </div>
    </section>

    <!-- MAIN -->

    <section id="main">

        <!-- FILTRO -->

        <div id="filtros">
            <div id="filtro">
                <i class="bi bi-grid"></i>
                <p>Categorias</p>
            </div>

            <div id="cx-pesquisa">
                <input type="search" id="inputPesquisa" placeholder="Buscar cursos...">
                <i class="bi bi-search"></i>
            </div>
        </div>

        <!-- CARD-CURSOS -->

        <div id="cursos">
            <div class="card-curso">
                <div class="img-curso">

                </div>
                <i class="categoria">
                    <i class="bi bi-code-slash"></i>
                </i>
                <div class="divCategoria">
                    <p>Categoria Categoria Categ</p>
                    <button class="saiba-mais">
                        Saiba-mais <i class="bi bi-arrow-right"></i>
                    </button>
                </div>

            </div>


        </div>
    </section>

    <!-- FOOTER -->

    <footer>
        <div id="socialMidia">
            <a class="icons" id="facebook"
                href="https://www.facebook.com/people/Senai-Parna%C3%ADba/100087170853809/#"><i
                    class="bi bi-facebook"></i></a>
            <a class="icons" id="instagram" href="https://www.instagram.com/senaiparnaiba/"><i
                    class="bi bi-instagram"></i></a>
            <a class="icons" id="whatsapp" href=""><i class="bi bi-whatsapp"></i></a>
        </div>

        <p>Copyright 2026 ©
            Todos os direitos reservados.</p>
        <button id="btnAdm">Administração</button>

    </footer>

    <script src="script/script.js"></script>
</body>

</html>
