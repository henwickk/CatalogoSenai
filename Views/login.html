<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login SENAI</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="login">

        <div class="perfil">
            <img src="img/logo.jpg">
        </div>

        <form id="formLogin">

            <div class="box">
                <i class="bi bi-person-fill"></i>

                <input type="text" id="nome_usuario" placeholder="Nome de usuário" required>
            </div>

            <div class="box">
                <i class="bi bi-lock-fill"></i>

                <input type="password" id="senha_usuario" placeholder="Senha" required>

                <button type="button" class="buttonMostrar" id="mostrarSenha">
                    <i class="bi bi-eye"></i>
                </button>
            </div>

            <button type="submit" class="btEntrar">
                Entrar
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <p id="mensagemLogin"></p>

        </form>

    </div>

    <script src="script/login.js" defer></script>

</body>

</html>
