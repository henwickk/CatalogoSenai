<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Views/css/gestao.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Gestão dos cards</title>
</head>

<body>
    <nav class="menu-lateral">
        <div class="btn-expandir">
            <i class="bi bi-list"></i>
        </div>

        <ul>
            <li class="item-menu">
                <a href="#">
                    <span class="icon"><i class="bi bi-card-text"></i></span>
                    <span class="txt-link">Cadastrar</span>
                </a>
            </li>

            <li class="item-menu">
                <a href="#">
                    <span class="icon"><i class="bi bi-archive"></i></i></span>
                    <span class="txt-link">Gerenciar</span>
                </a>
            </li>

            <li class="item-menu">
                <a href="#">
                    <span class="icon"><i class="bi bi-copy"></i></i></span>
                    <span class="txt-link">Categorias</span>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <section id="cad">
            <div class="cad2">
                <div id="cadastro-card">
                    <h1>Cadastrar novo curso</h1>
                    <div class="cad-box margins">
                        <div class="upload-img">
                            <input type="file" id="foto" name="foto" accept="image/*" hidden>
                            <label for="foto" class="upload-area">
                                <span><i class="bi bi-camera"></i></span>
                                <p>Arraste uma imagem ou clique</p>
                            </label>
                            <button class="btn-alt-img"><i class="bi bi-upload"></i> Alterar imagem </button>
                            <p>PNG, JPG ou WEBP (máx 5MB)</p>
                        </div>

                        <div class="infos-card">
                            <ul>
                                <label for="nomeCurso" class="txtl">Nome do curso</label><br>
                                <input type="text" name="nomeCurso" class="inputCad">
                            </ul>

                            <ul>
                                <label for="categoriaCurso" class="txtl">Categoria</label><br>
                                <input type="text" name="categoriaCurso" class="inputCad">
                            </ul>

                            <ul class="carga-horaria">
                                <p class="txtl">Carga Horária</p>
                                <input type="text" class="inputCad">
                            </ul>

                            <ul>
                                <label for="descricaoCurso" class="txtl">Descrição</label><br>
                                <textarea name="descricaoCurso" id="descCurso"></textarea>
                            </ul>


                        </div>

                    </div>
                    <div class="cad-box2 margins">
                        <div class="orgTP">
                            <p class="txtl">Turno</p>
                            <p class="txtl">Plano de curso</p>
                        </div>
                        <div class="turno-box">

                            <div class="icon-turnos">
                                <button class="btn-turnos">
                                    <i class="bi bi-sun"></i>
                                    <p>Manhã</p>
                                </button>

                                <button class="btn-turnos">
                                    <i class="bi bi-cloud-sun"></i>
                                    <p>Tarde</p>
                                </button>

                                <button class="btn-turnos">
                                    <i class="bi bi-moon"></i>
                                    <p>Noite</p>
                                </button>
                            </div>


                            <div class="plano-curso">
                                <input type="file" id="plano-curso" hidden>
                                <label for="plano-curso" class="btn-planoCurso">
                                    📁 Escolher arquivo
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="pre-visu">
                <p>Pré-visualização do card</p>
                <div class="card-curso">
                    <div class="img-curso">

                    </div>
                    <i class="categoria">
                        <i class="bi bi-code-slash"></i>
                    </i>
                    <div class="divCategoria">
                        <p>Categoria Categoria Categ</p>
                        <button class="saiba-mais">
                            Saiba-mais <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </div>
                <button class="btn-salvarCurso">Salvar Curso</button>
            </div>
        </section>
    </main>
</body>

</html>
