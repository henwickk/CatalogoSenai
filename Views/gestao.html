<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/Views/css/gestao.css">
    <title>Gestão Catálogo</title>
</head>

<body>
    <header>
            <button id="adm"><p>Administrador</p><i class="bi bi-person-circle"></i></button>
    </header>
    <main>
        <div id="cursos">
            <h2>Cursos</h2>
            <div id="infos">
                <h5>CURSO</h5>
                <h5>CATEGORIA</h5>
                <h5>STATUS</h5>
                <h5>TURNO</h5>
                <h5>AÇÕES</h5>
            </div>
            <div id="curso">
                <img src="/Views/img/exemplo.jpg" alt="" id="Cursoimg">
                <span>
                    <h5 id="nameCurso">Pedreiro</h5> <i class="bi bi-alarm" id="cargaH">200hrs</i>
                </span>
                <h5 id="catCurso">Construção</h5>
                <h5 id="statCurso">Ativo</h5>
                <h5 id="turno">Manhã</h5>
                <span id="actions"><i class="bi bi-pencil-square"></i> <i class="bi bi-trash"></i></span>
            </div>
            <button>Ver todos os cursos</button>
        </div>
        <div id="addCurso">
            <h2>Adicionar Curso</h2>
            <section id="1">
                <div id="imgCurso">
                    <h3>Imagem do curso</h3>
                    <label for="imagem" class="upload">Clique para escolher uma Imagem</label>
                    <input type="file" id="imagem" accept="image/*" hidden>
                    <img id="preview" src="img/default.png" alt="Prévia" style="max-width:300px; margin-top:15px;">
                </div>
                <div id="TC">
                    <div id="titulo">
                        <label for="titulo">Título</label>
                        <input type="text" placeholder="Ex: Desenvolvimento Web">
                    </div>

                    <div id="categoria">
                        <label for="categoria">Categoria</label>
                        <input type="text" placeholder="Selecione uma categoria">
                    </div>
            </section>
            <div id="descricao">
                <label for="descricao">Descrição</label>
                <textarea name="descricao" id="desc"></textarea>
            </div>

            <section id="2">
                <div id="dura">
                    <label id="duracao">Duração</label>
                    <input type="time">
                </div>

                <div id="statu">
                    <label id="status">Status</label>
                    <input type="text">
                </div>

                <div id="turn">
                    <label id="turno">Turno</label>
                    <input type="text">
                </div>

                <div id="prof">
                    <label id="professor">Professor</label>
                    <input type="text">
                </div>
            </section>
            <button><i class="bi bi-floppy"></i> Salvar Curso</button>
        </div>
    </main>

    <section>
        <h2>Categorias</h2>
        <div id="itemCate"><div id="icon"><i class="bi bi-code-slash"></i></div><h3 id="nomeC">Desenvolvimento</h3><h5 id="qntC">13 cursos</h5></div>
        <button>Novo Curso</button>
    </section>
</body>
<script src="/Views/script/script.js"></script>

</html>
